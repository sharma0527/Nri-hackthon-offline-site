<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASTRA — Cinematic Offline Experience</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #030712;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #videoContainer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      z-index: 10;
    }
    #videoContainer.active {
      opacity: 1;
      pointer-events: auto;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    #startScreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #08152e 0%, #030712 80%);
      z-index: 50;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #startScreen.hidden {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(34, 211, 238, 0.25);
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      cursor: pointer;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 8px #22d3ee;
    }
    .title {
      font-size: clamp(3.2rem, 8vw, 5.5rem);
      font-weight: 900;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 40%, #38bdf8 80%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 35px rgba(6, 182, 212, 0.45));
      margin-bottom: 0.75rem;
      cursor: pointer;
    }
    .subtitle {
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      letter-spacing: 0.25em;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 3.5rem;
    }
    .btn-start {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.25) 0%, rgba(14, 165, 233, 0.15) 100%);
      border: 1px solid rgba(34, 211, 238, 0.5);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      padding: 1.1rem 3.5rem;
      border-radius: 9999px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.25);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }
    .btn-start:hover:not(:disabled) {
      transform: translateY(-2px);
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.45) 0%, rgba(14, 165, 233, 0.3) 100%);
      border-color: #38bdf8;
      box-shadow: 0 0 45px rgba(34, 211, 238, 0.5);
    }
    .btn-start:active:not(:disabled) {
      transform: scale(0.96);
    }
    .btn-start:disabled {
      background: rgba(30, 41, 59, 0.7);
      border-color: rgba(245, 158, 11, 0.5);
      color: #fbbf24;
      cursor: not-allowed;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25);
    }
    .status-hint {
      margin-top: 1.25rem;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      color: #64748b;
      text-transform: uppercase;
    }
    .status-hint.ready { color: #10b981; }
    .status-hint.locked { color: #f59e0b; }

    /* Floating Cinema HUD: ONLY the Mute/Sound button is displayed */
    .cinema-hud {
      position: absolute;
      top: env(safe-area-inset-top, 1.25rem);
      right: env(safe-area-inset-right, 1.25rem);
      z-index: 40;
      transition: opacity 0.5s ease;
    }
    .cinema-hud.hud-hidden {
      opacity: 0;
    }
    .hud-sound-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e2e8f0;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      backdrop-filter: blur(12px);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
    }
    .hud-sound-btn:hover {
      background: rgba(6, 182, 212, 0.35);
      border-color: #22d3ee;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <div class="badge" id="adminBadge" title="Click 5 times for Organizer Passcode Override">
      <span class="badge-dot"></span>
      <span>ASTRA HACKATHON 2026</span>
    </div>
    
    <h1 class="title" id="brandTitle" title="Click 5 times for Organizer Passcode Override">ASTRA</h1>
    <p class="subtitle">Cinematic Offline Experience</p>

    <!-- START BUTTON -->
    <button id="startBtn" class="btn-start" onclick="startCinematic()">
      START FULLSCREEN
    </button>
    <div id="statusHint" class="status-hint ready">READY • TAP TO LAUNCH</div>
  </div>

  <div id="videoContainer">
    <!-- VIDEO IS 100% SILENT (AUDIO TRACK STRIPPED WITH -AN) -->
    <video id="heroVideo" loop muted playsinline webkit-playsinline="true" preload="auto">
      <source src="assets/video/astra-hero.mp4" type="video/mp4">
      <source src="hackthon video.mp4" type="video/mp4">
    </video>

    <!-- EXACTLY ONE AUDIO ELEMENT: ONLY /assets/audio/astra-theme.mp3 -->
    <audio id="bgSong" src="/assets/audio/astra-theme.mp3" preload="auto" loop style="display: none;"></audio>

    <!-- ONLY THIS MUTE/SOUND BUTTON IS DISPLAYED ON SCREEN -->
    <div class="cinema-hud" id="hudControls">
      <button class="hud-sound-btn" id="soundBtn" onclick="toggleSongMute()">
        <span id="soundIcon">🔊</span>
        <span id="soundText">SOUND ON</span>
      </button>
    </div>
  </div>

  <script>
    // DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
    let GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxEnhPkI6dWiI-83KS_j--0SfQ_C3LiL6c6HO5Wa8cQTzuRa8J8SLrdhxoOsoq_XKgS9g/exec";
    
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('script')) {
      GOOGLE_SCRIPT_URL = urlParams.get('script');
      localStorage.setItem('astra_script_url', GOOGLE_SCRIPT_URL);
    } else if (localStorage.getItem('astra_script_url')) {
      GOOGLE_SCRIPT_URL = localStorage.getItem('astra_script_url');
    }

    // Persistent Lock State
    let isLocked = localStorage.getItem('astra_is_locked') === 'true';
    if (urlParams.get('lock') === 'true') {
      isLocked = true;
      localStorage.setItem('astra_is_locked', 'true');
    } else if (urlParams.get('unlock') === 'true') {
      isLocked = false;
      localStorage.setItem('astra_is_locked', 'false');
    }

    const video = document.getElementById('heroVideo');
    const song = document.getElementById('bgSong');
    const startScreen = document.getElementById('startScreen');
    const videoContainer = document.getElementById('videoContainer');
    const startBtn = document.getElementById('startBtn');
    const statusHint = document.getElementById('statusHint');
    const soundBtn = document.getElementById('soundBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');
    const hudControls = document.getElementById('hudControls');

    // Permanently mute video element
    video.muted = true;

    function updateLockUI() {
      if (isLocked) {
        startBtn.disabled = true;
        startBtn.innerHTML = "🔒 LOCKED — WAITING FOR ORGANIZER";
        statusHint.className = "status-hint locked";
        statusHint.textContent = "WAITING FOR ORGANIZER SIGNAL • START IS BLOCKED";
      } else {
        startBtn.disabled = false;
        startBtn.innerHTML = "🚀 START FULLSCREEN";
        statusHint.className = "status-hint ready";
        statusHint.textContent = "UNLOCKED • TAP TO LAUNCH CINEMATIC EXPERIENCE";
      }
    }
    updateLockUI();

    // Remote Organizer Listener (800ms Near-Real-Time Polling via JSONP/Fetch)
    let lastCommandId = '0';
    function fetchStateJSONP(url, cb) {
      const cbName = 'offline_cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      const script = document.createElement('script');
      let timer = null;

      window[cbName] = function(data) {
        if (timer) clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        cb(null, data);
      };

      script.src = url + (url.includes('?') ? '&' : '?') + 'api=state&callback=' + cbName + '&_t=' + Date.now();
      script.onerror = function() {
        if (timer) clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        fetch(url + (url.includes('?') ? '&' : '?') + 'api=state&_t=' + Date.now())
          .then(res => res.json())
          .then(data => cb(null, data))
          .catch(err => cb(err, null));
      };

      timer = setTimeout(() => {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }, 3500);

      document.head.appendChild(script);
    }

    if (GOOGLE_SCRIPT_URL) {
      function checkRemoteStatus() {
        if (!navigator.onLine) return;
        fetchStateJSONP(GOOGLE_SCRIPT_URL, (err, data) => {
          if (err || !data || !data.success) return;

          // Update lock state
          if (data.state === 'LOCKED') {
            isLocked = true;
            localStorage.setItem('astra_is_locked', 'true');
            updateLockUI();
          } else if (data.state === 'UNLOCKED') {
            isLocked = false;
            localStorage.setItem('astra_is_locked', 'false');
            updateLockUI();
          }

          // Trigger remote actions on new commands
          if (data.commandId && data.commandId !== lastCommandId) {
            lastCommandId = data.commandId;

            if (data.state === 'PLAYING') {
              isLocked = false;
              startCinematic();
            } else if (data.state === 'STOPPED') {
              video.pause();
              song.pause();
              video.currentTime = 0;
              song.currentTime = 0;
              cinematicActive = false;
              startScreen.classList.remove('hidden');
              videoContainer.classList.remove('active');
            } else if (data.command === 'ASTRA_SYNC' && data.startTime) {
              const elapsed = Math.max(0, (Date.now() - data.startTime) / 1000);
              if (video.duration && isFinite(video.duration)) {
                video.currentTime = elapsed % video.duration;
              }
              if (song.duration && isFinite(song.duration)) {
                song.currentTime = elapsed % song.duration;
              }
            }
          }
        });
      }
      setInterval(checkRemoteStatus, 800);
      checkRemoteStatus();
    }

    // ORGANIZER OVERRIDE (PASSCODE: 0527)
    let clickCount = 0;
    let clickTimer = null;
    function handleAdminTrigger() {
      clickCount++;
      if (clickTimer) clearTimeout(clickTimer);
      clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
      if (clickCount >= 5) {
        clickCount = 0;
        const code = prompt("Organizer Security Override\nEnter Passcode:");
        if (code === "0527") {
          isLocked = !isLocked;
          localStorage.setItem('astra_is_locked', isLocked ? 'true' : 'false');
          updateLockUI();
          alert(isLocked ? "Website is now LOCKED" : "Website is now UNLOCKED!");
        } else if (code !== null) {
          alert("Invalid passcode.");
        }
      }
    }

    document.getElementById('adminBadge').addEventListener('click', handleAdminTrigger);
    document.getElementById('brandTitle').addEventListener('click', handleAdminTrigger);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'u' || e.key === 'U') {
        const code = prompt("Organizer Security Override\nEnter Passcode:");
        if (code === "0527") {
          isLocked = !isLocked;
          localStorage.setItem('astra_is_locked', isLocked ? 'true' : 'false');
          updateLockUI();
          alert(isLocked ? "Website is now LOCKED" : "Website is now UNLOCKED!");
        } else if (code !== null) {
          alert("Invalid passcode.");
        }
      }
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      if (e.key === 'm' || e.key === 'M') toggleSongMute();
      if (e.key === 'r' || e.key === 'R') {
        video.currentTime = 0;
        song.currentTime = 0;
        video.play().catch(() => {});
        song.play().catch(() => {});
      }
    });

    function toggleSongMute() {
      song.muted = !song.muted;
      if (song.muted) {
        soundIcon.textContent = "🔇";
        soundText.textContent = "MUTED";
      } else {
        soundIcon.textContent = "🔊";
        soundText.textContent = "SOUND ON";
        song.play().catch(() => {});
      }
    }

    // Auto-hide the sound button after 3.5 seconds of inactivity
    let hudTimeout = null;
    function showHudTemporarily() {
      hudControls.classList.remove('hud-hidden');
      if (hudTimeout) clearTimeout(hudTimeout);
      hudTimeout = setTimeout(() => {
        hudControls.classList.add('hud-hidden');
      }, 3500);
    }
    window.addEventListener('mousemove', showHudTemporarily);
    window.addEventListener('touchstart', showHudTemporarily);

    // =========================================================================
    // START EXPERIENCE: VIDEO IS SILENT, ASTRA-THEME.MP3 PLAYS WITH SOUND
    // =========================================================================
    async function startCinematic() {
      if (isLocked) {
        alert("The event has not started yet. Please wait for the organizer to unlock!");
        return;
      }

      // Prepare ASTRA theme
      song.pause();
      song.currentTime = 0;
      song.loop = true;
      song.muted = false;
      song.volume = 1;

      // Prepare ASTRA video
      video.pause();
      video.currentTime = 0;
      video.loop = true;
      video.muted = true;

      // Start ASTRA theme
      try {
        await song.play();
      } catch (error) {
        console.warn("ASTRA theme playback failed:", error);
      }

      // Start ASTRA video
      try {
        await video.play();
      } catch (error) {
        console.warn("ASTRA video playback failed:", error);
      }

      // Request fullscreen
      try {
        triggerFullscreen();
      } catch (error) {
        console.warn("Fullscreen request failed:", error);
      }

      startScreen.classList.add('hidden');
      videoContainer.classList.add('active');
      showHudTemporarily();
    }

    // Continuous Loop
    video.addEventListener('ended', () => {
      video.currentTime = 0;
      video.play().catch(() => {});
    });

    song.addEventListener('ended', () => {
      song.currentTime = 0;
      song.play().catch(() => {});
    });

    function triggerFullscreen() {
      const docEl = document.documentElement;
      try {
        if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => {});
        else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      } catch (e) {}
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        triggerFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      }
    }
  </script>
</body>
</html>
